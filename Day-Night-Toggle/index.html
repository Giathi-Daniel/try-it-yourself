<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day / Night Toggle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <label class="toggle">
    <input type="checkbox" aria-label="Dark mode">
    <span class="track">
      <i class="cloud"></i>
      <i class="stars"></i>
      <span class="knob"></span>
    </span>
  </label>
</body>
</html>
