<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Face Portrait</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="portrait">
    <div class="door"><i></i><i></i><i></i><i></i></div>
    <div class="shirt"></div>
    <div class="neck"></div>
    <div class="collar left"></div>
    <div class="collar right"></div>
    <div class="ear left"></div>
    <div class="ear right"></div>
    <div class="hair"></div>
    <div class="head">
      <div class="beard"></div>
      <div class="chin"></div>
      <div class="brow left"></div>
      <div class="brow right"></div>
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="nose"></div>
      <div class="tache"></div>
      <div class="mouth"><div class="teeth"></div></div>
    </div>
  </main>
</body>
</html>
