<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Stick Figure Walk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene">
    <div class="sun"></div>

    <div class="tree"><div class="crown"></div></div>
    <div class="tree two"><div class="crown"></div></div>

    <div class="road"></div>

    <div class="person">
      <div class="head"></div>
      <div class="body"></div>
      <div class="arm left"></div>
      <div class="arm right"></div>
      <div class="leg left"><div class="shin"></div></div>
      <div class="leg right"><div class="shin"></div></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
